name: Remote Import
on: 
  workflow_dispatch: # This adds a "Run" button in the GitHub Actions tab

jobs:
  import_zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Extract
        run: |
          # Replace the URL below with your actual server link
          curl -L -o data.zip "https://nextalg.com/kindle_firmware.zip"
          unzip data.zip
          rm data.zip

      - name: Commit files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Imported and extracted firmware via Workflow"
          git push
