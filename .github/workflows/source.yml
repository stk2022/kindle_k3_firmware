name: Download and Split External File

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository so the runner can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Download the file directly into the runner
      - name: Download Target File
        run: |
          curl -L -o Kindle_src_3.4.3_3543620001.tar.gz "https://kindledownloads.s3.amazonaws.com/Kindle_src_3.4.3_3543620001.tar.gz"

      # Step 3: Split the file into 90MB chunks
      - name: Split Large File
        run: |
          # Splits the file into Kindle_part_aa, Kindle_part_ab, etc.
          split -b 90M Kindle_src_3.4.3_3543620001.tar.gz Kindle_part_
          
          # Delete the original large file so it doesn't get tracked
          rm Kindle_src_3.4.3_3543620001.tar.gz

      # Step 4: Commit and push the split files back to your repository
      - name: Commit and Push Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add the split chunks
          git add Kindle_part_*
          
          # Commit only if the files are new or changed to avoid workflow errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: fetch and split latest Kindle source file" && git push)
